description: |
  Loongson 2K0300 SPI-IO master controller ("ls-spi-io", user manual chapter
  10), the register file of the SPI2 (0x1610c000) and SPI3 (0x1610e000)
  blocks - a different design from the "loongson,ls-spi" pair: 32 bit
  registers, a word count register (CSTART per byte with AUTOSUSPEND), and
  no hardware chip select lines at all (the vendor Linux driver drives the
  chip selects exclusively through "cs-gpios", and so does this port).

  Register file (vendor drivers/spi/spi-ls-io.c):

    0x00 CR1   spe(0) cstart(1) autosus(2) ssrev(8)
    0x04 CR2   rxfthlv(1:0) txfthlv(9:8) rxdmaen(7) txdmaen(15)
    0x08 CR3   mstr(0) dioswp(1) die(2) doe(3) ssmode(9:8)
    0x0c CR4
    0x10 IER
    0x14 SR1   rxa(0) txa(1) dxa(2) rxe(4) txe(5) susp(7) ovr(8) udr(9)
               crce(10) modf(11) eot(15, write 1 to clear)
    0x18 SR2   rxflv(2:0) txflv(10:8)
    0x20 CFG1  cpol(0) cpha(1) lsbfrst(7) dsize(12:8)
    0x24 CFG2  brdec(7:2) brint(15:8)  - the clock divider:
               divider = brint + brdec/64, register value (brint << 8)
    0x28 CFG3
    0x30/0x34 CRC1/CRC2
    0x40 DR    data register, BYTE wide on both access sides

  The per byte sequence the vendor driver runs: wait SR1.txa, write DR,
  set CR1 = spe | cstart | autosus, wait SR1.eot, write SR1.eot (clear),
  wait SR1.rxa, read DR.

  Divider: brint = clamp(DIV_ROUND_UP(ref_clk / sclk), 2, 255), so with the
  APB/DEVS clock (200 MHz on this board) SCLK runs from 100 MHz down to
  about 784 kHz in this port.

compatible: "loongson,ls-spi-io"

include: [spi-controller.yaml, base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true

  clock-names:
    required: false
