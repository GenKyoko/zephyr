description: |
  Loongson LIOINTC (Local I/O interrupt controller), version 2.0.

  The LIOINTC aggregates 32 internal peripheral interrupt lines and forwards
  them to one CPU interrupt line (a LoongArch IP2..IP7 line delivered through
  ESTAT.IS/ECFG.LIE). "reg" describes the "main" register block, while the
  per-core pending status lives in a separate "isr0" block.

  Children are numbered in the SoC-wide flat Zephyr IRQ space, starting at
  the value of "zephyr,irq-base" (i.e. child N of this instance is
  zephyr,irq-base + N).

compatible: "loongson,liointc-2.0"

include: [interrupt-controller.yaml, base.yaml]

interrupt-cells:
  - irq
  - priority

properties:
  reg:
    required: true

  reg-names:
    required: true

  loongson,parent-int-bitmap:
    type: array
    required: true
    description: |
      Four 32-bit words. Bit N of word P is set when child N is routed to
      parent line P (the parent lines are the "int0".."int3" interrupts of
      the node).

  zephyr,irq-base:
    type: int
    required: true
    description: |
      Flat Zephyr IRQ number assigned to child 0 of this LIOINTC instance.
