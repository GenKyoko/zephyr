description: |
  Loongson 2K0300 (and compatible 2K series SoC) GPIO controller.

  The IP is a "byte controlled" GPIO block: every pin owns one byte in each
  of the following regions, all relative to the controller base address
  (offsets as in the mainline Linux driver, BYTE_CTRL_MODE for ls2k0300):

    0x800  configuration / direction: bit0 = 1 -> input, bit0 = 0 -> output
    0x900  output value (bit0)
    0xa00  input value  (bit0)

  (The interrupt related regions of the block - 0xb00 .. 0xfff - are not
  modelled by this driver yet.)

  The pin count is given by "ngpios"; the pin index inside the IP block of
  the first pin of this instance is given by "loongson,pin-base" (the device
  tree splits the 106 pin block into banks of at most 32 pins so that the
  Zephyr pin numbers stay inside the 32 bit port mask).

compatible: "loongson,ls2k0300-gpio"

include: [gpio-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  ngpios:
    required: true

  loongson,pin-base:
    type: int
    description: |
      Pin index inside the IP block of pin 0 of this bank (default 0).

gpio-cells:
  - pin
  - flags
