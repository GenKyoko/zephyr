# SPDX-License-Identifier: Apache-2.0

description: |
  Loongson 2K0300 I2S controller ("IIS", user manual chapter 11).

  The block has a register file with a version register, a format register
  (channel word length, transmit/receive sample depth, bit clock divider), a
  control register (master/slave, bit order, transmit/receive enable, soft
  reset, MCLK output enable) and two 8 byte FIFO ports, one per direction. The
  codec system clock (MCLK) is derived from the controller clock through a
  fractional divider in "IISConfig1".

  The FIFOs are fed by the LSIA DMA controller: one circular channel per
  direction over a two block ring, paced by the controller's own data
  requests, the way the vendor's Linux driver does it. The interrupt sources
  of the block itself are left disabled - the manual defines them as FIFO
  overflow/underflow notifications, which cannot be used as a pacing signal.

compatible: "loongson,ls2k0300-i2s"

include: [i2s-controller.yaml, base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true

  slave-mode:
    type: boolean
    description: |
      The controller receives the bit clock and the frame clock instead of
      generating them. The vendor device tree calls this "slave-mode", and the
      driver of the 2K0300 board leaves it off: its machine driver configures
      the link with SND_SOC_DAIFMT_CBS_CFS, i.e. this controller is the master
      and the codec the slave.

      The setting has to match the wiring; a configuration request that asks
      for the other role is refused with -EINVAL.

  loongson,bclk-from-reference:
    type: boolean
    description: |
      What the bit clock divider counts. By default it divides the system clock
      (IISConfig1's fractional divider output), which is what the vendor driver
      does on the revision it calls 1, and the driver then picks the division so
      that BCLK comes out as an exact multiple of the frame rate.

      With this property the divider is taken to count the block's reference
      clock directly instead (the vendor driver's revision 0 model). That
      division generally cannot hit the frame rate exactly, so the driver uses
      the rate it really produces and derives the system clock from it, keeping
      the ratio the codec's rate register describes intact.

      Which one a given SoC revision implements is not documented - the vendor
      driver decides by the revision it reads from the PCI device, which the
      2K0300 does not have. Worth trying when the bit clock seems wrong by a
      fixed factor (a codec fed a bit clock several times too fast is heard as
      noise, not as audio).

  loongson,mclk-xfs:
    type: int
    default: 128
    description: |
      The system clock (MCLK) as a multiple of the frame rate - the "xfs" of
      the vendor driver. Its device trees never set it, so its default of 128
      is what the working configuration on this SoC programs:
      MCLK = 128 * frame rate = 6.144 MHz at 48 kHz, with the bit clock
      divider (BCLK_RATIO) taken as MCLK/(2*BCLK) - 1.

  loongson,dmas:
    type: phandle-array
    description: |
      The DMA controller that moves the data, and the channels its requests are
      wired to: <&lsia_dma transmit-channel receive-channel>. The requests are fixed in silicon - there is no request
      select register - so these two numbers are all a board has to get right;
      on the 2K0300 the I2S transmit request is on channel 1 and the receive
      request on channel 0, which is the mapping the vendor device tree uses
      ("dmas = <&dma 0 0xaf>, <&dma 1 0xbf>").

  loongson,data-in-gpios:
    type: phandle-array
    description: |
      The data input pin - the codec's data out - as a GPIO specifier
      (<&gpioN pin>). It has to be an input: this port's pin state only selects
      the function, and the pad direction register (GPIO_OEN, active low) is
      left as the boot loader found it. On this board that leaves all five
      interface pins as outputs, so without this the pad drives the codec's
      data line against it and the receive path reads nothing.

      Required: a board that leaves the pad direction to the boot loader has
      to name the pin here, or the receive path reads nothing.

  mclk-output:
    type: boolean
    description: |
      Drive the codec system clock (MCLK) on the MCLK pin. Boards whose codec
      is clocked from a fixed oscillator - as the 2K0300 board is, from a
      12.288 MHz can - leave this off so that nothing drives that pin.

      The MCLK pin is the first of the I2S pin group (GPIO76 on the 2K0300),
      which a board muxes through pinctrl like the other four.
