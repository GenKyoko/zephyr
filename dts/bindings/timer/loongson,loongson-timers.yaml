# SPDX-License-Identifier: Apache-2.0

description: |
  Loongson 2K0300 timer block ("ATIM" and "GTIM" in the SoC user manual,
  chapters 18 and 19; "timers1" and "timers2" in the vendor device tree).

  Each block is an STM32 style general purpose timer: a 32 bit auto reload
  counter with prescaler, four channels that can capture inputs or drive
  outputs (output compare / PWM), encoder mode, and DMA request lines. The
  blocks are clocked by the APB bus (LS2K0300_CLK_APB) and raise one interrupt
  each, on the extended interrupt controller:

    0x1611_8000  ATIM   EIOINTC vector 25   flat IRQ 41
    0x1611_9000  GTIM   EIOINTC vector 26   flat IRQ 42
    0x1611_a000  BTIM   EIOINTC vector 27   flat IRQ 43

  (BTIM exists in the SoC but has no node in the vendor device tree, so the
  2K0300 device tree describes the first two only.)

  Node name, label and compatible come from the vendor device tree
  (arch/loongarch/boot/dts/loongson-2k0300.dtsi): mainline Linux has no 2K0300
  device tree yet, so there is no mainline naming to prefer. In Linux the block
  is an MFD parent (drivers/mfd/loongson-timers.c) that populates a "pwm" child
  ("loongson,ls2k-pwm-timer", drivers/pwm/pwm-ls-timer.c), and boards enable the
  node and its child and assign the channel pins through pinctrl.

compatible: "loongson,loongson-timers"

include: [base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  clock-names:
    required: true
