# Loongson PAI board: the ST7735S TFT on SPI2 (160x128, RGB565).

# The sample's 4 KiB main stack overflows on this board before LVGL is even
# up (the display subsystem's init and the first flush run on it); the
# SSD1306 round needed 8 KiB for the same reason.
CONFIG_MAIN_STACK_SIZE=8192

# The ST7735S wants 16 bit words big endian on the wire; LVGL produces little
# endian RGB565, so the byte pair gets swapped in software.
CONFIG_LV_COLOR_16_SWAP=y

# A full 160x128 frame is 40 KiB; the sample's 16 KiB pool would make LVGL's
# partial rendering fall back to tiny fragments. Headroom keeps it smooth.
CONFIG_LV_Z_MEM_POOL_SIZE=32768
