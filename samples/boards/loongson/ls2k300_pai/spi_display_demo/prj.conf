# Dynamic LVGL demo for the ST7735S TFT on SPI2 (160x128, RGB565).

CONFIG_DISPLAY=y
CONFIG_LVGL=y

# The ST7735S wants 16 bit words big endian on the wire; LVGL produces little
# endian RGB565, so the byte pair gets swapped in software.
CONFIG_LV_COLOR_16_SWAP=y

# A full 160x128 frame is 40 KiB; headroom for the demo's widgets.
CONFIG_LV_Z_MEM_POOL_SIZE=32768

# The display init and the first flushes run on the main thread; 4 KiB
# overflows before LVGL is even up.
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_LOG=y
