# The board enables the I2S controller and its ES8388 codec through the device
# tree; the two subsystems have to be on for their drivers to be built.
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_I2S=y

# The sample prints its progress, and the console is the evidence of the audio
# path, so keep the output simple.
CONFIG_LOG=n
CONFIG_PRINTK=y
